name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드 · 린트 · 단위 테스트
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
